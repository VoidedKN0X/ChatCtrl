name: CodeQL

# Static analysis of the app's Java and Kotlin code. Results go to the Security tab;
# this never blocks a release.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      # The Android build checks that Element Call is there; a placeholder is enough here (nothing is packaged
      # or published).
      - name: Placeholder for Element Call
        run: |
          mkdir -p element-call/dist/element-call
          echo '<!doctype html><title>placeholder</title>' > element-call/dist/element-call/index.html

      - uses: github/codeql-action/init@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (debug, no secrets)
        run: |
          chmod +x gradlew
          # CI and GITHUB_ACTIONS unset: without the release secrets the build would otherwise refuse to configure.
          env -u CI -u GITHUB_ACTIONS ./gradlew --no-daemon assembleDebug

      - uses: github/codeql-action/analyze@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          category: "/language:java-kotlin"
