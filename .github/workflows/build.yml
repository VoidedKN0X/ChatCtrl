name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "element-call/**"
  workflow_dispatch:

# Nothing by default; every job asks only for what it needs.
permissions: {}

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  # The call screen: Element Call, built from source at the commit pinned in element-call/upstream.env, with
  # ChatCtrl's patches (no Google reCAPTCHA or MediaPipe, no analytics, crash reporting or bug-report upload).
  # Its build runs pnpm install, which runs the dependencies' install scripts, so it gets its own job with
  # read-only access and no secrets; only its output (element-call/dist) is handed to the signing job.
  # If this fails, the APK isn't built and nothing is released.
  element-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1

      - name: Cache Element Call's dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ~/.cache/node/corepack
          key: element-call-pnpm-${{ hashFiles('element-call/upstream.env') }}
          restore-keys: element-call-pnpm-

      - name: Build Element Call from source
        env:
          EC_PNPM_STORE: ${{ runner.temp }}/pnpm-store
        # zizmor: ignore[adhoc-packages] corepack is installed from a tarball checked against its SHA-512 first
        run: |
          # Corepack 0.34.5+ is needed for pnpm 11 and 12 (Element Call's and matrix-js-sdk's); Node 24.11's is older.
          # Downloaded and checked against the registry's SHA-512 (its "integrity") before installing, so only this
          # exact package runs.
          curl -fsSL -o "$RUNNER_TEMP/corepack-0.36.0.tgz" https://registry.npmjs.org/corepack/-/corepack-0.36.0.tgz
          echo "4a2889b01859a9d0623c74c497a393dec012ad1aca21c61340cb15197c7a104fe033c5853306237885fc4edf11894e08bf627a2db4fc2a919f08eb01a51581ff  $RUNNER_TEMP/corepack-0.36.0.tgz" | sha512sum -c -
          npm install -g "$RUNNER_TEMP/corepack-0.36.0.tgz"
          corepack enable
          set -o pipefail
          if ! bash element-call/build.sh 2>&1 | tee element-call-build.log; then
            # Surface the end of the log as annotations so the error is visible without opening the logs.
            tail -n 150 element-call-build.log | sed 's/\x1b\[[0-9;]*m//g' | split -l 50 - "$RUNNER_TEMP/ec-log-"
            for f in "$RUNNER_TEMP"/ec-log-*; do
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Element Call build failed ($(basename "$f"))::$msg"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: element-call-dist
          path: element-call/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [version, element-call]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
      apk: ${{ steps.name.outputs.apk }}
      signed: ${{ steps.name.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The Gradle wrapper jar in the repo must be an official Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Element Call, built in its own job without any secrets (see the element-call job above).
      - name: Get the Element Call build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: element-call-dist
          path: element-call/dist

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::error title=Unsigned build::No signing secrets set - release builds must be signed with the release key"
            exit 1
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Google-free dependency audit
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Nothing from Google Play services, Firebase, ML Kit, Play Core or Tink may end up in the app.
          # Runs while the keystore is still there: the build refuses to configure a release on CI without it.
          if ! ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2> deps-err.txt; then
            grep -E 'What went wrong|Exception|error' -A 3 deps-err.txt | head -20 | while IFS= read -r line; do echo "::error title=Dependency audit::${line}"; done
            exit 1
          fi
          if grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt; then
            grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          echo "::notice title=Google-free::No Google Play services, Firebase, ML Kit, Play Core or Tink in the release dependencies"

      - name: Name APK and check signature
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK="ChatCtrl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" = "1" ] && echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::Secrets are set but the APK is debug-signed - check the key alias and passwords"
            exit 1
          fi
          if [ "$RELEASE_SIGNED" != "1" ] || echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::APK is not release-signed"
            exit 1
          fi
          # Must be ChatCtrl's release key (fingerprint in SECURITY.md), or phones won't accept the update.
          EXPECTED="9ee0fc5f523fe1b8d684964053e0aa56c65b4f726e5608de9dbe8b61ac929aba"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error title=Wrong signing key::$APK is signed with $ACTUAL, expected the ChatCtrl release key $EXPECTED"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "apk=$APK"
            echo "signed=1"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed APK::$APK signed by $CERT (SHA-256 $SHA)"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChatCtrl-apk
          path: |
            ${{ env.APK }}
            app/build/outputs/mapping/release/mapping.txt

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # sign the build provenance with Sigstore
      attestations: write  # store the build provenance with the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ChatCtrl-apk
          path: dist

      # Signed proof that this APK was built by this workflow from the tagged commit:
      # gh attestation verify ChatCtrl-vX.Y.Z.apk -R VoidedKN0X/ChatCtrl
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          # The APK's SHA-256, to check a download against.
          {
            echo
            for f in dist/*.apk; do
              echo "SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`  $(basename "$f")"
            done
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        # zizmor: ignore[superfluous-actions] softprops/action-gh-release is on the repo's allow-list and pinned; gh release would do the same.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ChatCtrl ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/${{ needs.build.outputs.apk }}
          body_path: ${{ runner.temp }}/notes.md
