name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "element-call/**"
  workflow_dispatch:

# Nothing by default; every job asks only for what it needs.
permissions: {}

env:
  # SHA-256 of ChatCtrl's release signing certificate, the one in SECURITY.md and README.md
  # (lower case, no colons). The sign job refuses to hand on an APK signed with anything else.
  EXPECTED_CERT_SHA256: 9ee0fc5f523fe1b8d684964053e0aa56c65b4f726e5608de9dbe8b61ac929aba

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  # The call screen: Element Call, built from source at the commit pinned in element-call/upstream.env, with
  # ChatCtrl's patches (no Google reCAPTCHA or MediaPipe, no analytics, crash reporting or bug-report upload).
  # Its build runs pnpm install, which runs the dependencies' install scripts, so it gets its own job with
  # read-only access and no secrets; only its output (element-call/dist) is handed to the build job.
  # If this fails, the APK isn't built and nothing is released.
  element-call:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1

      - name: Cache Element Call's dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ~/.cache/node/corepack
          key: element-call-pnpm-${{ hashFiles('element-call/upstream.env') }}
          restore-keys: element-call-pnpm-

      - name: Build Element Call from source
        env:
          EC_PNPM_STORE: ${{ runner.temp }}/pnpm-store
        # zizmor: ignore[adhoc-packages] corepack is installed from a tarball checked against its SHA-512 first
        run: |
          # Corepack 0.34.5+ is needed for pnpm 11 and 12 (Element Call's and matrix-js-sdk's); Node 24.11's is older.
          # Downloaded and checked against the registry's SHA-512 (its "integrity") before installing, so only this
          # exact package runs.
          curl -fsSL -o "$RUNNER_TEMP/corepack-0.36.0.tgz" https://registry.npmjs.org/corepack/-/corepack-0.36.0.tgz
          echo "4a2889b01859a9d0623c74c497a393dec012ad1aca21c61340cb15197c7a104fe033c5853306237885fc4edf11894e08bf627a2db4fc2a919f08eb01a51581ff  $RUNNER_TEMP/corepack-0.36.0.tgz" | sha512sum -c -
          npm install -g "$RUNNER_TEMP/corepack-0.36.0.tgz"
          corepack enable
          set -o pipefail
          if ! bash element-call/build.sh 2>&1 | tee element-call-build.log; then
            # Surface the end of the log as annotations so the error is visible without opening the logs.
            tail -n 150 element-call-build.log | sed 's/\x1b\[[0-9;]*m//g' | split -l 50 - "$RUNNER_TEMP/ec-log-"
            for f in "$RUNNER_TEMP"/ec-log-*; do
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Element Call build failed ($(basename "$f"))::$msg"
            done
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: element-call-dist
          path: element-call/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Builds the release APK UNSIGNED. This job runs Gradle, and with it every plugin, dependency and
  # build script, so it gets no secrets at all: the signing key only exists in the sign job below.
  build:
    needs: [version, element-call]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # app/build.gradle.kts: build the release without a signing config (app-release-unsigned.apk).
      UNSIGNED_RELEASE: "true"
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      version: ${{ steps.name.outputs.version }}
      apk: ${{ steps.name.outputs.apk }}
      apk_sha256: ${{ steps.name.outputs.apk_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the documented signing certificate
        # The fingerprint the sign job enforces must be the one users are told to check.
        run: |
          colons=$(echo "$EXPECTED_CERT_SHA256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          for f in SECURITY.md README.md; do
            if ! grep -qF "$colons" "$f"; then
              echo "::error title=Fingerprint mismatch::EXPECTED_CERT_SHA256 in build.yml is not the fingerprint in $f"
              exit 1
            fi
          done
          echo "build.yml, SECURITY.md and README.md agree on $colons"

      # The Gradle wrapper jar in the repo must be an official Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # No Gradle cache: every build downloads its dependencies fresh and checks them against
          # gradle/verification-metadata.xml. A cache saved by one run (also by a failed one) was
          # restored by every later run, so one bad download kept failing builds until the caches
          # were deleted by hand; and a release must not be built from files an earlier run left behind.
          cache-disabled: true

      # Element Call, built in its own job without any secrets (see the element-call job above).
      - name: Get the Element Call build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: element-call-dist
          path: element-call/dist

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Google-free dependency audit
        run: |
          # Nothing from Google Play services, Firebase, ML Kit, Play Core or Tink may end up in the app.
          # Needs no key: UNSIGNED_RELEASE=true (job env) lets the release build type configure without one.
          if ! ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2> deps-err.txt; then
            grep -E 'What went wrong|Exception|error' -A 3 deps-err.txt | head -20 | while IFS= read -r line; do echo "::error title=Dependency audit::${line}"; done
            exit 1
          fi
          if grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt; then
            grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          echo "::notice title=Google-free::No Google Play services, Firebase, ML Kit, Play Core or Tink in the release dependencies"

      - name: Name and collect the unsigned APK
        id: name
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK="ChatCtrl-${TAG}.apk"
          # Exactly one APK, and it must be the unsigned one: this job has no key to sign with.
          set -- app/build/outputs/apk/release/*.apk
          if [ "$#" -ne 1 ] || [ "$(basename "$1")" != "app-release-unsigned.apk" ]; then
            echo "::error title=Unexpected build output::Expected only app-release-unsigned.apk, found: $*"
            exit 1
          fi
          mkdir -p out
          cp "$1" "out/ChatCtrl-${TAG}-unsigned.apk"
          # R8's mapping file travels with the APK, as before.
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt out/mapping.txt
          fi
          sum=$(sha256sum "out/ChatCtrl-${TAG}-unsigned.apk" | cut -d' ' -f1)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "apk=$APK"
            echo "apk_sha256=$sum"
          } >> "$GITHUB_OUTPUT"
          echo "Unsigned APK SHA-256: $sum"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Not installable: Android refuses an unsigned APK. The signed one is ChatCtrl-apk.
          name: ChatCtrl-unsigned-apk
          path: |
            out/*.apk
            out/mapping.txt
          if-no-files-found: error

  # Signs the APK the build job made. The only job that sees the release key, and it runs no code
  # from this repo: no checkout, no Gradle, only zipalign and apksigner from the runner's Android SDK.
  sign:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions: {}   # no token rights at all; artifacts of this run need none
    outputs:
      release_signed: ${{ steps.sign.outputs.release_signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ChatCtrl-unsigned-apk
          path: unsigned

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILT_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No KEYSTORE_BASE64 secret set - refusing to publish an APK that isn't signed with the release key. Add the release key secrets."
            exit 1
          fi
          in="unsigned/ChatCtrl-${TAG}-unsigned.apk"
          # The file the build job made, byte for byte.
          echo "$BUILT_SHA256  $in" | sha256sum -c -

          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Android build-tools: $tools"
          mkdir -p work out
          # Gradle already aligns the APK; align only if it isn't (signing must come after aligning).
          if "${tools}zipalign" -c -P 16 4 "$in"; then
            cp "$in" work/aligned.apk
          else
            "${tools}zipalign" -P 16 -f 4 "$in" work/aligned.apk
          fi

          umask 077
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          # The same schemes the Android Gradle plugin used for these releases (minSdk 35): APK
          # Signature Scheme v2 only. Passwords are read from the environment, never the command line.
          "${tools}apksigner" sign \
            --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true \
            --v3-signing-enabled false --v4-signing-enabled false \
            --out "out/ChatCtrl-${TAG}.apk" work/aligned.apk
          rm -f "$ks"
          echo "release_signed=true" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check release signature
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          # The APK must be signed with ChatCtrl's release key, or phones won't accept it as an update.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          apk="out/ChatCtrl-${TAG}.apk"
          "${tools}apksigner" verify --verbose --print-certs "$apk" | tee signer.txt
          signers=$(grep -c 'certificate SHA-256 digest: ' signer.txt || true)
          actual=$(grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]+' signer.txt || true)
          if [ "$signers" != "1" ] || [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::$apk has $signers signer(s), first ${actual:-none}; expected only the ChatCtrl release key $EXPECTED_CERT_SHA256"
            exit 1
          fi
          if ! grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' signer.txt; then
            echo "::error title=Not v2-signed::$apk has no valid APK Signature Scheme v2 signature"
            exit 1
          fi
          "${tools}zipalign" -c -P 16 4 "$apk"
          # Signing must not have changed anything inside the APK: same files, same contents, same order.
          python3 - "unsigned/ChatCtrl-${TAG}-unsigned.apk" "$apk" <<'PY'
          import sys, zipfile
          a, b = ([(i.filename, i.CRC, i.file_size, i.compress_type) for i in zipfile.ZipFile(p).infolist()] for p in sys.argv[1:3])
          if a != b:
              sys.exit("::error title=APK changed while signing::The signed APK's contents differ from the APK the build job made")
          print(f"Signed APK has the same {len(a)} files as the build job's APK.")
          PY
          echo "::notice title=Signed::APK signed with the ChatCtrl release key ($actual)"
          sha256sum "$apk"
          # R8's mapping file (to read obfuscated stack traces) stays next to the APK in the artifact, as before.
          if [ -f unsigned/mapping.txt ]; then cp unsigned/mapping.txt out/mapping.txt; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChatCtrl-apk
          path: |
            out/*.apk
            out/mapping.txt
          if-no-files-found: error

  release:
    needs: [version, build, sign]
    if: needs.version.outputs.release == 'true' && needs.sign.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # publish the release
      id-token: write      # sign the build provenance with Sigstore
      attestations: write  # store the build provenance with the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ChatCtrl-apk
          path: dist

      # Signed proof that this APK was built by this workflow from the tagged commit:
      # gh attestation verify ChatCtrl-vX.Y.Z.apk -R VoidedKN0X/ChatCtrl
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          # The APK's SHA-256, to check a download against.
          {
            echo
            for f in dist/*.apk; do
              echo "SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`  $(basename "$f")"
            done
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        # zizmor: ignore[superfluous-actions] softprops/action-gh-release is on the repo's allow-list and pinned; gh release would do the same.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ChatCtrl ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/${{ needs.build.outputs.apk }}
          body_path: ${{ runner.temp }}/notes.md
